<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>json-tidy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #1b1f24;
    --muted: #5c6773;
    /* --line clears 3:1 against --bg, --card and the row hover tint (WCAG 1.4.11) */
    --line: #868c99;
    --bg: #f7f8fa;
    --card: #ffffff;
    --accent: #2b5bd7;
    --danger: #b42318;
    --note: #8a5a00;
    --str: #0a7d43;
    --num: #1f5fbf;
    --bool: #7a3ecb;
    --null: #626b78;
    --key: #2c3540;
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }

  .wrap {
    max-width: 46rem;
    margin: 0 auto;
    padding: 1rem;
  }

  header h1 {
    font-size: 1.375rem;
    margin: 0 0 .25rem;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: .9375rem;
    overflow-wrap: anywhere;
  }

  label.paste-label {
    display: block;
    font-size: .8125rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: .25rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 8.5rem;
    padding: .625rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: .875rem;
    line-height: 1.4;
    resize: vertical;
  }

  textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin: .625rem 0 .75rem;
  }

  .controls button {
    min-height: 2.5rem;
    padding: .5rem .875rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: .9375rem;
    cursor: pointer;
  }

  .controls button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  #message {
    min-height: 1.5rem;
    margin: 0 0 .75rem;
    padding: .125rem 0 .125rem .625rem;
    border-left: 3px solid transparent;
    font-size: .9375rem;
    overflow-wrap: anywhere;
  }

  #message.is-error { border-left-color: var(--danger); color: var(--danger); }
  #message.is-note { border-left-color: var(--note); color: var(--note); }
  #message .detail {
    display: block;
    margin-top: .125rem;
    font-size: .8125rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  #hint {
    color: var(--muted);
    font-size: .9375rem;
    padding: .5rem 0 1rem;
    overflow-wrap: anywhere;
  }

  #tree {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: .8125rem;
    /* indent budget: --d is the row's depth, set in JS; CSS does the capping */
    --indent: 1em;
    --indent-cap: 10;
  }

  .row {
    display: flex;
    align-items: flex-start;
    gap: .25rem;
    border-top: 1px solid var(--line);
  }

  .row, .more {
    padding-left: calc(min(var(--d, 0), var(--indent-cap)) * var(--indent));
  }

  .row:first-child { border-top: 0; }

  .row:hover { background: #eef2f7; }

  .chev, .chev-gap {
    flex: 0 0 auto;
    width: 2.5rem;
    min-height: 2.5rem;
  }

  .chev {
    border: 1px solid transparent;
    border-radius: .25rem;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: .75rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  .chev:hover { background: #e0e6f0; }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
    padding: .625rem 0;
  }

  .k { color: var(--key); font-weight: 600; }
  .sep { color: var(--muted); }
  .sum { color: var(--muted); }
  .v-string { color: var(--str); }
  .v-number { color: var(--num); }
  .v-boolean { color: var(--bool); }
  .v-null { color: var(--null); }

  .copy {
    flex: 0 0 auto;
    min-height: 2.5rem;
    min-width: 4rem;
    padding: .25rem .5rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--accent);
    font: inherit;
    font-size: .75rem;
    cursor: pointer;
  }

  .copy.is-copied { color: var(--str); border-color: var(--str); }

  .more {
    padding-top: .25rem;
    padding-bottom: .25rem;
  }

  .more button {
    min-height: 2.5rem;
    padding: .5rem .75rem;
    border: 1px dashed var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--accent);
    font: inherit;
    font-size: .8125rem;
    cursor: pointer;
  }

  /* Phone width: indentation is the largest consumer of a 288 px content box.
     Cap it hard so the value column keeps a readable measure at real nesting
     depths. Depth beyond the cap is still shown by the row's own nesting. */
  @media (max-width: 30rem) {
    #tree { --indent: .6em; --indent-cap: 4; }
    .copy { min-width: 3.5rem; padding-left: .25rem; padding-right: .25rem; }
  }

  footer {
    margin-top: 1.5rem;
    padding-top: .75rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .8125rem;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>json-tidy</h1>
    <p>Paste JSON, get a collapsible tree, copy the JSONPath of any node.</p>
  </header>

  <main>
    <label class="paste-label" for="input">Paste JSON</label>
    <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
      autofocus placeholder='{"hello": "world"}'></textarea>

    <div class="controls">
      <button type="button" id="tidy" class="primary">Tidy</button>
      <button type="button" id="sample">Load sample</button>
      <button type="button" id="clear">Clear</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <p id="hint">Paste or type JSON above and the tree shows up here. Objects and arrays open one level at a time.</p>

    <div id="tree"></div>
  </main>

  <footer>No upload, no server: the JSON never leaves this tab.</footer>
</div>

<script>
(function () {
  'use strict';

  var LARGE_INPUT = 2000000;
  var DEBOUNCE_MS = 200;

  var input = document.getElementById('input');
  var message = document.getElementById('message');
  var hint = document.getElementById('hint');
  var tree = document.getElementById('tree');

  /* ---------- message region ---------- */

  function clearMessage() {
    message.textContent = '';
    message.className = '';
  }

  function showMessage(text, detail, kind) {
    message.textContent = '';
    message.className = kind ? 'is-' + kind : '';
    message.appendChild(document.createTextNode(text));
    if (detail) {
      var d = document.createElement('span');
      d.className = 'detail';
      d.textContent = detail;
      message.appendChild(d);
    }
  }

  /* ---------- error text ---------- */

  function lineColFromPosition(text, pos) {
    if (pos > text.length) { pos = text.length; }
    var line = 1, lastBreak = -1;
    for (var i = 0; i < pos; i++) {
      if (text.charCodeAt(i) === 10) { line++; lastBreak = i; }
    }
    return { line: line, column: pos - lastBreak };
  }

  function describeError(err, text) {
    var raw = (err && err.message) ? String(err.message) : String(err);
    var at = /position (\d+)/.exec(raw);
    var lc = null;
    if (at) {
      lc = lineColFromPosition(text, parseInt(at[1], 10));
    } else {
      var m = /line (\d+) column (\d+)/i.exec(raw);
      if (m) { lc = { line: parseInt(m[1], 10), column: parseInt(m[2], 10) }; }
    }
    if (lc) {
      return {
        text: 'That is not valid JSON — line ' + lc.line + ', column ' + lc.column + '.',
        detail: raw
      };
    }
    return {
      text: 'That is not valid JSON. Check for a missing comma, quote, or bracket.',
      detail: raw
    };
  }

  /* ---------- parse ---------- */

  function showHint(show) {
    hint.style.display = show ? '' : 'none';
  }

  function parseAndRender(text) {
    tree.textContent = '';
    if (!text || !text.trim()) {
      clearMessage();
      showHint(true);
      return;
    }
    var value;
    try {
      value = JSON.parse(text);
    } catch (err) {
      var d = describeError(err, text);
      showMessage(d.text, d.detail, 'error');
      showHint(false);
      return;
    }
    clearMessage();
    showHint(false);
    render(value);
  }

  /* ---------- jsonpath ---------- */

  var IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;

  function uni(code) {
    var h = code.toString(16).toUpperCase();
    while (h.length < 4) { h = '0' + h; }
    return '\\u' + h;
  }

  function bracketSegment(key) {
    var out = '';
    for (var i = 0; i < key.length; i++) {
      var ch = key.charAt(i);
      var code = key.charCodeAt(i);
      if (ch === '\\') {
        out += '\\\\';
      } else if (ch === "'") {
        out += "\\'";
      } else if (code < 0x20 || code === 0x7F) {
        out += uni(code);
      } else if (code >= 0xD800 && code <= 0xDBFF) {
        var next = key.charCodeAt(i + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) { out += ch + key.charAt(i + 1); i++; }
        else { out += uni(code); }
      } else if (code >= 0xDC00 && code <= 0xDFFF) {
        out += uni(code);
      } else {
        out += ch;
      }
    }
    return "['" + out + "']";
  }

  function segment(isArray, key, index) {
    if (isArray) { return '[' + index + ']'; }
    if (IDENT.test(key)) { return '.' + key; }
    return bracketSegment(key);
  }

  /* ---------- copy ---------- */

  function copyFallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(text).then(function () {
          done(true);
        }, function () {
          done(copyFallback(text));
        });
        return;
      } catch (e) { /* fall through */ }
    }
    done(copyFallback(text));
  }

  /* ---------- tree ---------- */

  var BATCH = 200;
  var STRING_LIMIT = 120;

  function isContainer(v) { return v !== null && typeof v === 'object'; }

  function summaryOf(v) {
    var n = Array.isArray(v) ? v.length : Object.keys(v).length;
    return Array.isArray(v)
      ? '[…] ' + n + (n === 1 ? ' item' : ' items')
      : '{…} ' + n + (n === 1 ? ' key' : ' keys');
  }

  function truncate(s) {
    if (s.length <= STRING_LIMIT) { return s; }
    var cut = s.slice(0, STRING_LIMIT);
    var last = cut.charCodeAt(cut.length - 1);
    if (last >= 0xD800 && last <= 0xDBFF) { cut = cut.slice(0, -1); }
    return cut + '…';
  }

  function leafSpan(v) {
    var span = document.createElement('span');
    if (v === null) {
      span.className = 'v-null';
      span.textContent = 'null';
    } else if (typeof v === 'string') {
      span.className = 'v-string';
      span.textContent = '"' + truncate(v) + '"';
    } else if (typeof v === 'number') {
      span.className = 'v-number';
      span.textContent = Object.is(v, -0) ? '-0' : String(v);
    } else if (typeof v === 'boolean') {
      span.className = 'v-boolean';
      span.textContent = v ? 'true' : 'false';
    } else {
      span.className = 'v-null';
      span.textContent = String(v);
    }
    return span;
  }

  function childCount(v) {
    return Array.isArray(v) ? v.length : Object.keys(v).length;
  }

  function makeRow(keyLabel, value, depth, path) {
    var row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('data-path', path);
    row.style.setProperty('--d', String(depth));

    var container = isContainer(value);
    /* An empty object or array has nothing to reveal, so it gets no chevron
       (a toggle that renders nothing is a dead control). The summary stays. */
    var openable = container && childCount(value) > 0;
    var chev;
    if (openable) {
      chev = document.createElement('button');
      chev.type = 'button';
      chev.className = 'chev';
      chev.textContent = '▸';
      chev.setAttribute('aria-expanded', 'false');
      chev.setAttribute('aria-label', 'Expand ' + keyLabel);
    } else {
      chev = document.createElement('span');
      chev.className = 'chev-gap';
      chev.setAttribute('aria-hidden', 'true');
    }
    row.appendChild(chev);

    var content = document.createElement('span');
    content.className = 'content';
    var k = document.createElement('span');
    k.className = 'k';
    k.textContent = keyLabel === '' ? '""' : keyLabel;
    content.appendChild(k);
    var sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = ': ';
    content.appendChild(sep);
    if (container) {
      var sum = document.createElement('span');
      sum.className = 'sum';
      sum.textContent = summaryOf(value);
      content.appendChild(sum);
    } else {
      content.appendChild(leafSpan(value));
    }
    row.appendChild(content);

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'copy';
    copy.textContent = 'copy';
    copy.setAttribute('aria-label', 'Copy path ' + path);
    copy.addEventListener('click', function () {
      copyText(path, function (ok) {
        if (!ok) { return; }
        if (copy._timer) { clearTimeout(copy._timer); }
        copy.textContent = 'copied';
        copy.classList.add('is-copied');
        copy._timer = setTimeout(function () {
          copy.textContent = 'copy';
          copy.classList.remove('is-copied');
          copy._timer = null;
        }, 1200);
      });
    });
    row.appendChild(copy);

    row._jsonValue = value;
    row._path = path;
    row._keyLabel = keyLabel;
    row._depth = depth;
    row._chevron = openable ? chev : null;
    return row;
  }

  function appendNode(parent, keyLabel, value, depth, path, before) {
    var row = makeRow(keyLabel, value, depth, path);
    parent.insertBefore(row, before || null);
    if (row._chevron) {
      var kids = document.createElement('div');
      kids.className = 'kids';
      kids.style.display = 'none';
      parent.insertBefore(kids, before || null);
      row._kids = kids;
      row._cursor = 0;
      row._rendered = false;
      row._expanded = false;
      row._chevron.addEventListener('click', function () { toggle(row); });
    }
    return row;
  }

  function renderBatch(row) {
    var v = row._jsonValue;
    var kids = row._kids;
    var isArr = Array.isArray(v);
    if (!row._entries && !isArr) { row._entries = Object.entries(v); }
    var total = isArr ? v.length : row._entries.length;

    /* The more button is never removed and re-created while batches remain:
       new rows are inserted before it and its label is updated in place, so
       keyboard focus stays on the element the user just activated. */
    var end = Math.min(row._cursor + BATCH, total);
    var first = null;
    for (var i = row._cursor; i < end; i++) {
      var key = isArr ? String(i) : row._entries[i][0];
      var val = isArr ? v[i] : row._entries[i][1];
      var added = appendNode(kids, key, val, row._depth + 1,
        row._path + segment(isArr, key, i), row._more);
      if (!first) { first = added; }
    }
    row._cursor = end;
    row._rendered = true;

    var remaining = total - end;
    if (remaining > 0) {
      if (!row._more) {
        var wrap = document.createElement('div');
        wrap.className = 'more';
        wrap.style.setProperty('--d', String(row._depth + 1));
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.addEventListener('click', function () { renderBatch(row); });
        wrap.appendChild(btn);
        kids.appendChild(wrap);
        row._more = wrap;
        row._moreButton = btn;
      }
      row._moreButton.textContent = 'Show ' + BATCH + ' more (' + remaining + ' remaining)';
    } else if (row._more) {
      var hadFocus = document.activeElement === row._moreButton;
      kids.removeChild(row._more);
      row._more = null;
      row._moreButton = null;
      if (hadFocus && first) {
        var next = first.querySelector('.chev') || first.querySelector('.copy');
        if (next) { next.focus(); }
      }
    }
  }

  function toggle(row) {
    if (row._expanded) {
      row._kids.style.display = 'none';
      row._expanded = false;
      row._chevron.textContent = '▸';
      row._chevron.setAttribute('aria-expanded', 'false');
      row._chevron.setAttribute('aria-label', 'Expand ' + row._keyLabel);
      return;
    }
    if (!row._rendered) { renderBatch(row); }
    row._kids.style.display = '';
    row._expanded = true;
    row._chevron.textContent = '▾';
    row._chevron.setAttribute('aria-expanded', 'true');
    row._chevron.setAttribute('aria-label', 'Collapse ' + row._keyLabel);
  }

  function render(value) {
    tree.textContent = '';
    var root = appendNode(tree, '$', value, 0, '$');
    if (root._chevron) { toggle(root); }
  }

  /* ---------- sample ---------- */

  var SAMPLE = JSON.stringify({
    "items": [
      {
        "id": 1,
        "user name": "Ada Lovelace",
        "email": "ada@example.com",
        "active": true,
        "score": 99.5,
        "tags": ["admin", "beta"],
        "note": null
      },
      {
        "id": 2,
        "user name": "Grace Hopper",
        "email": "grace@example.com",
        "active": false,
        "score": 87,
        "tags": ["ops"],
        "note": "A deliberately long value so you can see how the tree truncates display text at one hundred and twenty characters while the copied path stays exact."
      }
    ],
    "weird.key": "dots in a key force the bracket form",
    "it's": "so does an apostrophe",
    "0": "a numeric-looking key is not an array index",
    "": "the empty key",
    "meta": {
      "generated": "2026-08-11T09:30:00Z",
      "count": 2,
      "nested": { "a": { "b": { "c": [1, 2, 3] } } }
    }
  }, null, 2);

  /* ---------- wiring ---------- */

  var timer = null;

  function scheduleParse() {
    if (timer !== null) { clearTimeout(timer); }
    if (input.value.length > LARGE_INPUT) {
      timer = null;
      showHint(false);
      showMessage('Large input — press Tidy to parse.', '', 'note');
      return;
    }
    timer = setTimeout(function () {
      timer = null;
      parseAndRender(input.value);
    }, DEBOUNCE_MS);
  }

  function tidyNow() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
    parseAndRender(input.value);
  }

  function tidyClicked() {
    tidyNow();
    if (!input.value.trim()) {
      showHint(true);
      input.focus();
    }
  }

  input.addEventListener('input', scheduleParse);
  document.getElementById('tidy').addEventListener('click', tidyClicked);
  document.getElementById('sample').addEventListener('click', function () {
    input.value = SAMPLE;
    tidyNow();
  });
  document.getElementById('clear').addEventListener('click', function () {
    input.value = '';
    tidyNow();
    input.focus();
  });

  parseAndRender(input.value);
}());
</script>
</body>
</html>
