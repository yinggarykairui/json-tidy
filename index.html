<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>json-tidy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #1b1f24;
    --muted: #5c6773;
    /* --line is for control boundaries only and clears 3:1 against --bg,
       --card and the row hover tint (WCAG 1.4.11). Row dividers are not
       control boundaries, so they use the quieter --row-line: 2.11:1 on the
       row backdrop, 1.99:1 on the hover tint -- enough to draw a grid on a
       low-contrast display, still visibly quieter than a control edge. */
    --line: #868c99;
    --row-line: #a3aebf;
    --bg: #f7f8fa;
    --card: #ffffff;
    --accent: #2b5bd7;
    --danger: #b42318;
    --note: #8a5a00;
    --str: #0a7d43;
    --num: #1f5fbf;
    --bool: #7a3ecb;
    --null: #626b78;
    --key: #2c3540;
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }

  .wrap {
    max-width: 46rem;
    margin: 0 auto;
    padding: 1rem;
  }

  header h1 {
    font-size: 1.375rem;
    margin: 0 0 .25rem;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: .9375rem;
    overflow-wrap: anywhere;
  }

  label.paste-label {
    display: block;
    font-size: .8125rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: .25rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 8.5rem;
    padding: .625rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: .875rem;
    line-height: 1.4;
    resize: vertical;
  }

  textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin: .625rem 0 .75rem;
  }

  .controls button {
    min-height: 2.5rem;
    padding: .5rem .875rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: .9375rem;
    cursor: pointer;
  }

  .controls button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  #message {
    /* Tall enough to hold one line without growing (15px x 1.45 plus .25rem
       of padding), so a message appearing where there was none does not push
       the tree down and take the reader's scroll position with it. */
    min-height: 1.75rem;
    margin: 0 0 .75rem;
    padding: .125rem 0 .125rem .625rem;
    border-left: 3px solid transparent;
    font-size: .9375rem;
    overflow-wrap: anywhere;
  }

  #message.is-error { border-left-color: var(--danger); color: var(--danger); }
  #message.is-note { border-left-color: var(--note); color: var(--note); }
  #message .detail {
    display: block;
    margin-top: .125rem;
    font-size: .8125rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  #hint {
    color: var(--muted);
    font-size: .9375rem;
    padding: .5rem 0 1rem;
    overflow-wrap: anywhere;
  }

  #tree {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: .8125rem;
    /* indent budget: --d is the row's depth, set in JS; CSS does the capping */
    --indent: 1em;
    --indent-cap: 10;
  }

  .row {
    display: flex;
    align-items: flex-start;
    gap: .25rem;
    border-top: 1px solid var(--row-line);
  }

  .row, .more {
    /* First declaration is the fallback: an engine without min() inside
       calc() drops only the second line and still indents by depth, at the
       right scale, instead of collapsing the tree to flat. */
    padding-left: calc(var(--d, 0) * var(--indent));
    padding-left: calc(min(var(--d, 0), var(--indent-cap)) * var(--indent));
  }

  /* Every row carries a divider except the first one in the tree, so the
     ruling reads as a grid instead of appearing above arbitrary rows. */
  #tree > .row:first-child { border-top: 0; }

  .chev, .chev-gap {
    flex: 0 0 auto;
    width: 2.5rem;
    min-height: 2.5rem;
  }

  /* Chrome for the controls, not text: dragging across the tree to paste it
     into a ticket used to pick up every "copy" label and chevron glyph. */
  .copy, .chev {
    -webkit-user-select: none;
    user-select: none;
  }

  .chev {
    border: 1px solid transparent;
    border-radius: .25rem;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: .75rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }


  /* Hover states only where a pointer can actually hover: on a touch screen
     :hover sticks to the last tapped row. */
  @media (hover: hover) {
    .row:hover { background: #eef2f7; }
    .chev:hover { background: #e0e6f0; }
    /* The copy button is the primary control in the tree and was the only
       interactive element on the page that answered a pointer with nothing. */
    .copy:hover { background: #e0e6f0; border-color: var(--accent); }
    /* Once it has been pressed, the button keeps white ground: the copied
       green measures 4.16:1 on the hover tint and 5.21:1 on white, and this
       is the state the pointer is most often sitting on. The green label and
       border are already a louder answer than a tint. */
    .copy.is-copied:hover { background: var(--card); }
  }

  /* A colour change the eye can follow, short enough not to lag a click. */
  @media (prefers-reduced-motion: no-preference) {
    .row { transition: background-color 120ms ease-out; }
    .copy, .chev {
      transition: background-color 120ms ease-out, border-color 120ms ease-out,
                  color 120ms ease-out;
    }
  }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
    /* Runs of spaces inside a key or a value are meaningful -- collapsing
       them made "a b" and "a  b" render as the same row. Escaped text has no
       newlines or tabs left in it, so pre-wrap only preserves the spaces. */
    white-space: pre-wrap;
    padding: .625rem 0;
  }

  /* A row with a chevron is a row that opens, and its label is the biggest
     thing on it: the adjacent-sibling selector picks out exactly those rows,
     since a row without children carries a .chev-gap span instead. */
  .chev + .content { cursor: pointer; }

  .k { color: var(--key); font-weight: 600; }
  .sep { color: var(--muted); }
  .sum { color: var(--muted); }
  .v-string { color: var(--str); }
  .v-number { color: var(--num); }
  .v-boolean { color: var(--bool); }
  .v-null { color: var(--null); }

  .copy {
    flex: 0 0 auto;
    min-height: 2.5rem;
    min-width: 4rem;
    padding: .25rem .5rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--accent);
    font: inherit;
    font-size: .75rem;
    cursor: pointer;
  }

  .copy.is-copied { color: var(--str); border-color: var(--str); }

  .more {
    padding-top: .25rem;
    padding-bottom: .25rem;
  }

  .more button {
    min-height: 2.5rem;
    padding: .5rem .75rem;
    border: 1px dashed var(--line);
    border-radius: .375rem;
    background: var(--card);
    color: var(--accent);
    font: inherit;
    font-size: .8125rem;
    cursor: pointer;
  }

  /* Phone width: indentation is the largest consumer of a 288 px content box,
     so the step shrinks from 1em to .45em (5.85 px per level here, 13 px at
     desktop width). That is on top of --indent-cap, not instead of it: the
     cap buys a bounded indent budget -- 58.5 px at 320, 130 px at 1280, so
     the content box never gets squeezed into a horizontal scroll -- and pays
     for it by rendering depth 10 and everything below it at the same offset
     (17 depths, 11 distinct positions). Depth 1-10 stay distinct; past that,
     the chevrons and the summaries carry the structure, not the indent. */
  @media (max-width: 30rem) {
    #tree { --indent: .45em; }
    .copy { min-width: 3.5rem; padding-left: .25rem; padding-right: .25rem; }
  }

  footer {
    margin-top: 1.5rem;
    padding-top: .75rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .8125rem;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>json-tidy</h1>
    <p>Paste JSON, get a collapsible tree, copy the JSONPath of any node.</p>
  </header>

  <main>
    <label class="paste-label" for="input">Paste JSON</label>
    <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
      autofocus placeholder='{"hello": "world"}'></textarea>

    <div class="controls">
      <button type="button" id="tidy" class="primary">Tidy</button>
      <button type="button" id="sample">Load sample</button>
      <button type="button" id="clear">Clear</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <p id="hint">Paste or type JSON above and the tree shows up here. Objects and arrays open one level at a time.</p>

    <div id="tree"></div>
  </main>

  <footer>No upload, no server: the JSON never leaves this tab.</footer>
</div>

<script>
(function () {
  'use strict';

  var LARGE_INPUT = 2000000;
  var DEBOUNCE_MS = 200;

  var input = document.getElementById('input');
  var message = document.getElementById('message');
  var hint = document.getElementById('hint');
  var tree = document.getElementById('tree');

  /* ---------- message region ---------- */

  function clearMessage() {
    message.textContent = '';
    message.className = '';
  }

  function showMessage(text, detail, kind) {
    message.textContent = '';
    message.className = kind ? 'is-' + kind : '';
    message.appendChild(document.createTextNode(text));
    if (detail) {
      var d = document.createElement('span');
      d.className = 'detail';
      d.textContent = detail;
      message.appendChild(d);
    }
  }

  /* ---------- error text ---------- */

  function lineColFromPosition(text, pos) {
    if (pos > text.length) { pos = text.length; }
    var line = 1, lastBreak = -1;
    for (var i = 0; i < pos; i++) {
      if (text.charCodeAt(i) === 10) { line++; lastBreak = i; }
    }
    return { line: line, column: pos - lastBreak };
  }

  var ADVICE = 'Check for a missing comma, quote, or bracket.';

  /* The engine says "at position N" for most parse failures, but for the
     "Unexpected token" family -- a stray comma before a value, a bare word, a
     tag pasted instead of JSON -- it gives no position at all and quotes a
     window of the document instead. Recover the offset from that window, and
     only when it is unambiguous: the quoted text has to appear exactly once in
     the document, and the character the engine names exactly once inside the
     window. Anything else and the offset is a guess, so there is none: a caret
     that confidently lands on the wrong line is worse than a caret that does
     not move. */
  var UNEXPECTED = /^Unexpected token (.*?), ([\s\S]*) is not valid JSON$/;

  function recoverPosition(raw, text) {
    var m = UNEXPECTED.exec(raw);
    if (!m) { return null; }
    var token = m[1];
    if (token.length < 3 || token.charAt(0) !== "'" ||
        token.charAt(token.length - 1) !== "'") { return null; }
    token = token.slice(1, -1);
    var quoted = m[2];
    /* The leading and trailing ellipses mark where the engine cut the
       document; what is between the quotes is meant to be verbatim. */
    if (quoted.slice(0, 3) === '...') { quoted = quoted.slice(3); }
    if (quoted.slice(-3) === '...') { quoted = quoted.slice(0, -3); }
    if (quoted.length < 3 || quoted.charAt(0) !== '"' ||
        quoted.charAt(quoted.length - 1) !== '"') { return null; }
    var snippet = quoted.slice(1, -1);
    var start = text.indexOf(snippet);
    if (start < 0 || start !== text.lastIndexOf(snippet)) { return null; }
    var at = snippet.indexOf(token);
    if (at < 0 || at !== snippet.lastIndexOf(token)) { return null; }
    var pos = start + at;
    return text.substr(pos, token.length) === token ? pos : null;
  }

  function describeError(err, text) {
    var raw = (err && err.message) ? String(err.message) : String(err);
    var at = /position (\d+)/.exec(raw);
    var lc = null, pos = null;
    if (at) { pos = parseInt(at[1], 10); }
    /* Read before the recovered offset joins in, so that whether a document
       counts as merely unfinished still turns on what the engine itself
       reported -- the amber note is a judgement about the document, not about
       how well we can point at it. */
    var incomplete = /unexpected end of (json input|data)/i.test(raw) ||
      (pos !== null && pos >= text.replace(/\s+$/, '').length);
    if (pos === null) { pos = recoverPosition(raw, text); }
    if (pos !== null) {
      lc = lineColFromPosition(text, pos);
    } else {
      var m = /line (\d+) column (\d+)/i.exec(raw);
      if (m) { lc = { line: parseInt(m[1], 10), column: parseInt(m[2], 10) }; }
    }
    /* The sentence above already says the line and the column. Where they
       were read out of the engine's own trailing echo, drop the echo and keep
       the diagnostic clause, which is the only part that says what to fix. */
    var detail = lc ? raw.replace(/\s*\(line \d+ column \d+\)\s*$/i, '') : raw;
    if (lc) {
      return {
        text: 'That is not valid JSON — line ' + lc.line + ', column ' + lc.column + '. ' + ADVICE,
        detail: detail,
        pos: pos,
        incomplete: incomplete
      };
    }
    return {
      text: 'That is not valid JSON. ' + ADVICE,
      detail: detail,
      pos: pos,
      incomplete: incomplete
    };
  }

  /* ---------- state that survives a re-parse ---------- */

  /* A re-parse used to cost the user everything they had opened. Two
     mechanisms answer that; this is the first.

     Idempotence: a parse that cannot change the tree does not touch the tree.
     Both tiers are deliberately conservative -- they may call two equivalent
     documents different, and must never call two differing documents
     identical.

     Tier 1 is text identity: identical trimmed text parses to an identical
     value, so one string compare settles it, and that compare is what catches
     a stray keystroke or a second press of Tidy.

     Tier 2 is value equivalence. The tree is a pure function of the parsed
     value and Object.entries order is exactly JSON.stringify order, so equal
     canonical strings mean row-for-row identical output -- with two values
     that are lossier through stringify than through the renderer: -0
     stringifies to 0, and a non-finite number stringifies to null. RISKY
     skips tier 2 for any text that might hold one. It over-matches (a digit
     before an e inside a string is enough), and an over-match costs nothing
     but a rebuild. */

  var lastText = null;
  var lastCanon = null;
  var RISKY = /-0|\d[eE]|\d{15}/;

  var UNCHANGED = 'Nothing changed \u2014 the tree is already up to date.';

  function canonical(value) {
    try { return JSON.stringify(value); } catch (e) { return null; }
  }

  /* The second mechanism: a genuine rebuild, and a parse error that empties
     the tree, both hand the next successful render what was open. Rows own
     their own state, so capture is one pass over the tree; paths are unique
     inside a document (keys are unique, indices are unique), so a path is a
     valid key. The result is held in one variable and consumed by the next
     successful render.

     Collapsing a node hides its children, it does not discard them: the rows
     stay in the DOM with their own open/closed state intact, and re-opening
     the parent shows them exactly as they were. So capture records every row
     the user has ever opened -- how many batches it rendered, and whether it
     is open right now -- not only the rows that happen to be open. Recording
     only the open ones would let one collapsed ancestor throw away every
     expansion beneath it on the next re-parse. */

  var savedState = null;

  /* A .kids container always follows the row that owns it, so walking up is
     one previousElementSibling per level. */
  function pathChain(row) {
    var chain = [];
    var node = row;
    while (node && node._path !== undefined) {
      chain.push(node._path);
      var parent = node.parentNode;
      if (!parent || parent === tree) { break; }
      node = parent.previousElementSibling;
    }
    return chain;
  }

  function captureState() {
    var rows = tree.querySelectorAll('.row');
    if (!rows.length) { return null; }
    var state = { nodes: Object.create(null), count: 0, chain: null, top: 0 };
    var anchor = null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      /* A row that was never opened has nothing under it to put back. */
      if (row._kids && (row._expanded === true || row._cursor > 0)) {
        state.nodes[row._path] = { cursor: row._cursor, open: row._expanded === true };
        /* Counted for the message, which is about what the user opened: the
           root opens itself on every document, so it is nobody's choice and
           belongs in neither half of the count. */
        if (row._expanded === true && row._depth > 0) { state.count++; }
      }
      /* The scroll anchor is the topmost row still on screen, kept with the
         chain of paths above it so that a document which drops the row itself
         can still land the user near where they were. */
      if (!anchor && row.getBoundingClientRect().bottom > 0) { anchor = row; }
    }
    if (anchor) {
      state.chain = pathChain(anchor);
      state.top = anchor.getBoundingClientRect().top;
    }
    return state;
  }

  /* Emptying the tree is where state is worth keeping: a rebuild is about to
     start, or a parse error is about to leave the region blank. */
  function emptyTree() {
    if (tree.firstChild) {
      var state = captureState();
      if (state) { savedState = state; }
    }
    tree.textContent = '';
  }

  /* Breadth-first from the root, so a parent is rendered before its children
     are looked for -- that is also what makes the batch counts restorable:
     the saved cursor is rendered before the node's own children are read.
     Restoring never renders more rows than the user had already rendered
     once, so it cannot cost more than the work they already paid for. */
  function restoreExpanded(state) {
    var kept = 0;
    var queue = [];
    var root = tree.firstElementChild;
    if (root && root._path !== undefined) { queue.push(root); }
    while (queue.length) {
      var row = queue.shift();
      var want = state.nodes[row._path];
      /* A path the new document no longer has -- key deleted, array
         shortened, container replaced by a leaf or now empty -- is dropped
         without comment. The user edited the document; it is not an error. */
      if (want === undefined || !row._chevron) { continue; }
      var total = childCount(row._jsonValue);
      var target = want.cursor < total ? want.cursor : total;
      /* renderBatch always advances the cursor by at least one child, so the
         loop is already bounded by the node's own child count; the counter is
         a stop against a future renderBatch that could return without
         advancing, which would otherwise hang the tab. */
      var guard = 0;
      while (row._cursor < target && guard++ < 100000) { renderBatch(row); }
      /* Restore the row to the state it was left in -- a node the user had
         closed comes back closed, with everything they had opened inside it
         still there, ready for the next click. */
      if (want.open !== row._expanded) { toggle(row); }
      if (want.open && row._depth > 0) { kept++; }
      var kids = row._kids.children;
      for (var i = 0; i < kids.length; i++) {
        if (kids[i]._path !== undefined) { queue.push(kids[i]); }
      }
    }
    return kept;
  }

  function restoreScroll(state) {
    if (!state.chain) { return; }
    var byPath = Object.create(null);
    var rows = tree.querySelectorAll('.row');
    for (var i = 0; i < rows.length; i++) { byPath[rows[i]._path] = rows[i]; }
    for (var j = 0; j < state.chain.length; j++) {
      var row = byPath[state.chain[j]];
      if (!row) { continue; }
      /* Synchronous, in the same task as the restore, so there is no jump. */
      var delta = row.getBoundingClientRect().top - state.top;
      if (delta) { window.scrollBy(0, delta); }
      return;
    }
  }

  /* The tree on screen is the last successful parse whenever it is non-empty,
     so a document that is already rendered needs no work at all. */
  function unchangedDocument(text, value, canon) {
    if (lastText === null || !tree.firstChild) { return false; }
    if (text.trim() === lastText.trim()) { return true; }
    if (arguments.length < 3 || lastCanon === null || canon === null) { return false; }
    if (RISKY.test(text) || RISKY.test(lastText)) { return false; }
    return canon === lastCanon;
  }

  /* ---------- parse ---------- */

  function showHint(show) {
    hint.style.display = show ? '' : 'none';
  }

  /* An error that is only being held back because the user is mid-word. It is
     shown in full the moment they leave the box or press Tidy. */
  var softError = null;

  /* Moving the caret to the parse error would collapse a selection the user
     made on purpose, in the box, to replace or delete. */
  function hasSelection() {
    try { return input.selectionEnd > input.selectionStart; }
    catch (e) { return false; }
  }

  function parseAndRender(text, opts) {
    opts = opts || {};
    /* Load sample and Clear are the one control a lost user reaches for, so
       they are hard resets rather than ordinary re-parses: no idempotence
       check can swallow them, and the document arrives in its own canonical
       root-only form instead of wearing the open nodes of whatever happened
       to be in the box before. Emptying the tree here rather than through
       emptyTree() is the point -- there is nothing to carry forward. */
    if (opts.reset) {
      tree.textContent = '';
      savedState = null;
      lastText = null;
      lastCanon = null;
    }
    if (!text || !text.trim()) {
      /* An empty box is a fresh start: Clear, then a paste of an unrelated
         document, should not inherit the old document's open nodes. */
      tree.textContent = '';
      savedState = null;
      lastText = null;
      lastCanon = null;
      softError = null;
      clearMessage();
      showHint(true);
      return;
    }
    if (unchangedDocument(text)) {
      lastText = text;
      softError = null;
      showHint(false);
      /* Only an explicit action gets a line: the debounced typing path would
         otherwise announce itself on every keystroke. */
      if (opts.hard) { showMessage(UNCHANGED); } else { clearMessage(); }
      return;
    }
    var value;
    try {
      value = JSON.parse(text);
    } catch (err) {
      emptyTree();
      var d = describeError(err, text);
      if (!opts.hard && d.incomplete && document.activeElement === input) {
        /* Typing a document produces a parse error on nearly every keystroke.
           Painting that red, and hiding the page's only instruction while it
           is up, punishes the user for not having finished yet. */
        softError = d;
        showMessage('Not valid JSON yet — the document looks unfinished.', '', 'note');
        showHint(true);
        return;
      }
      softError = null;
      showMessage(d.text, d.detail, 'error');
      showHint(false);
      if (opts.seekPosition && d.pos !== null && !hasSelection()) {
        /* The box shows about seven of the lines it holds, pinned to the end.
           Put the caret where the parser stopped. Chromium scrolls to the
           selection when the box takes focus, not when the selection moves,
           so the caret has to be placed before the focus call. */
        try {
          input.blur();
          input.setSelectionRange(d.pos, d.pos);
          input.focus();
        } catch (e) { /* older engines: no caret control, no harm */ }
      }
      return;
    }
    var canon = canonical(value);
    if (unchangedDocument(text, value, canon)) {
      lastText = text;
      softError = null;
      showHint(false);
      if (opts.hard) { showMessage(UNCHANGED); } else { clearMessage(); }
      return;
    }
    softError = null;
    clearMessage();
    showHint(false);
    emptyTree();
    var stats = render(value);
    lastText = text;
    lastCanon = canon;
    /* Nothing to report when the user had opened nothing: a count of zero
       reads as a failure beside a tree that is perfectly correct. */
    if (opts.hard && stats && stats.total > 0) {
      showMessage('Kept ' + stats.kept + ' of ' + stats.total +
        (stats.total === 1 ? ' expanded node.' : ' expanded nodes.'));
    }
  }

  /* ---------- jsonpath ---------- */

  var IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;

  function uni(code) {
    var h = code.toString(16).toUpperCase();
    while (h.length < 4) { h = '0' + h; }
    return '\\u' + h;
  }

  function bracketSegment(key) {
    var out = '';
    for (var i = 0; i < key.length; i++) {
      var ch = key.charAt(i);
      var code = key.charCodeAt(i);
      if (ch === '\\') {
        out += '\\\\';
      } else if (ch === "'") {
        out += "\\'";
      } else if (code < 0x20 || code === 0x7F) {
        out += uni(code);
      } else if (code >= 0xD800 && code <= 0xDBFF) {
        var next = key.charCodeAt(i + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) { out += ch + key.charAt(i + 1); i++; }
        else { out += uni(code); }
      } else if (code >= 0xDC00 && code <= 0xDFFF) {
        out += uni(code);
      } else {
        out += ch;
      }
    }
    return "['" + out + "']";
  }

  function segment(isArray, key, index) {
    if (isArray) { return '[' + index + ']'; }
    if (IDENT.test(key)) { return '.' + key; }
    return bracketSegment(key);
  }

  /* ---------- display escaping ---------- */

  var ESC_SHORT = { 8: '\\b', 9: '\\t', 10: '\\n', 12: '\\f', 13: '\\r' };

  function isBidiControl(code) {
    return (code >= 0x200E && code <= 0x200F) ||
           (code >= 0x202A && code <= 0x202E) ||
           (code >= 0x2066 && code <= 0x2069) ||
           code === 0x2028 || code === 0x2029;
  }

  /* Displayed keys and string values are written the way JSON writes them, so
     that two nodes differing only by whitespace, a quote or an invisible
     direction mark read as two different nodes. Paths are built separately by
     segment()/bracketSegment() and are deliberately untouched. */
  function escapeDisplay(s) {
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var code = s.charCodeAt(i);
      if (ch === '\\') {
        out += '\\\\';
      } else if (ch === '"') {
        out += '\\"';
      } else if (ESC_SHORT[code]) {
        out += ESC_SHORT[code];
      } else if (code < 0x20 || code === 0x7F) {
        out += uni(code);
      } else if (isBidiControl(code)) {
        /* Bidi controls and line separators. An override inside a span
           reverses the glyphs that follow it, including glyphs belonging to
           the next span, so a key can rewrite its own row's value backwards.
           unicode-bidi: isolate does not undo an override; escaping does. */
        out += uni(code);
      } else if (code >= 0xD800 && code <= 0xDBFF) {
        var next = s.charCodeAt(i + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) { out += ch + s.charAt(i + 1); i++; }
        else { out += uni(code); }
      } else if (code >= 0xDC00 && code <= 0xDFFF) {
        out += uni(code);
      } else {
        out += ch;
      }
    }
    return out;
  }

  /* A path is not display text and must not go through escapeDisplay: it is
     already escaped for JSONPath, so escaping it again doubles the backslash
     bracketSegment wrote and shows a path that no longer resolves. Everything
     bracketSegment leaves raw is already safe to render except a bidi control,
     which reverses the glyphs after it -- so escape exactly those, and only
     where the path is shown to a human. The clipboard string and data-path
     stay raw so they keep resolving; aria-label is escaped with the rest,
     because nothing resolves a label and two paths differing only by an
     invisible override would otherwise be announced as the same path. */
  function escapePathForDisplay(p) {
    var out = '';
    for (var i = 0; i < p.length; i++) {
      var code = p.charCodeAt(i);
      out += isBidiControl(code) ? uni(code) : p.charAt(i);
    }
    return out;
  }

  /* ---------- copy ---------- */

  function copyFallback(text) {
    /* The temporary textarea steals focus and clears the document selection.
       On file:// this branch is the only one that runs, so without putting
       both back a copy costs the user their place in the tab order and any
       text they had highlighted. */
    var wasFocused = document.activeElement;
    var sel = window.getSelection ? window.getSelection() : null;
    var ranges = [];
    if (sel) {
      for (var r = 0; r < sel.rangeCount; r++) { ranges.push(sel.getRangeAt(r)); }
    }

    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.setAttribute('aria-hidden', 'true');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);

    if (sel) {
      sel.removeAllRanges();
      for (var j = 0; j < ranges.length; j++) {
        try { sel.addRange(ranges[j]); } catch (e2) { /* range no longer valid */ }
      }
    }
    if (wasFocused && wasFocused !== document.body && typeof wasFocused.focus === 'function') {
      try { wasFocused.focus({ preventScroll: true }); } catch (e3) { wasFocused.focus(); }
    }
    return ok;
  }

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(text).then(function () {
          done(true);
        }, function () {
          done(copyFallback(text));
        });
        return;
      } catch (e) { /* fall through */ }
    }
    done(copyFallback(text));
  }

  /* ---------- tree ---------- */

  var BATCH = 200;
  var STRING_LIMIT = 120;

  function isContainer(v) { return v !== null && typeof v === 'object'; }

  function summaryOf(v) {
    var n = Array.isArray(v) ? v.length : Object.keys(v).length;
    return Array.isArray(v)
      ? '[…] ' + n + (n === 1 ? ' item' : ' items')
      : '{…} ' + n + (n === 1 ? ' key' : ' keys');
  }

  function truncate(s) {
    if (s.length <= STRING_LIMIT) { return s; }
    var cut = s.slice(0, STRING_LIMIT);
    var last = cut.charCodeAt(cut.length - 1);
    if (last >= 0xD800 && last <= 0xDBFF) { cut = cut.slice(0, -1); }
    return cut + '…';
  }

  /* A tooltip is not a document viewer: the full text of a 400 kB string is
     an attribute nobody can read and every serialisation has to carry. */
  var TITLE_LIMIT = 2000;

  function capTitle(s) {
    if (s.length <= TITLE_LIMIT) { return s; }
    var cut = s.slice(0, TITLE_LIMIT);
    var last = cut.charCodeAt(cut.length - 1);
    if (last >= 0xD800 && last <= 0xDBFF) { cut = cut.slice(0, -1); }
    return cut + '\u2026';
  }

  function leafSpan(v) {
    var span = document.createElement('span');
    if (v === null) {
      span.className = 'v-null';
      span.textContent = 'null';
    } else if (typeof v === 'string') {
      span.className = 'v-string';
      var shown = truncate(v);
      span.textContent = '"' + escapeDisplay(shown) + '"';
      /* Only when the display actually cut something: a title on every value
         would fire a tooltip that repeats what is already on screen. */
      if (shown !== v) { span.title = capTitle(escapeDisplay(v)); }
    } else if (typeof v === 'number') {
      if (isFinite(v)) {
        span.className = 'v-number';
        span.textContent = Object.is(v, -0) ? '-0' : String(v);
      } else {
        /* JSON has no Infinity. 1e400 parses to Infinity, and printing that
           in number style asserts a value the source never held -- and the
           text it prints is not itself valid JSON. Annotate instead. */
        span.className = 'v-null';
        span.textContent = String(v) + ' (outside the JSON number range)';
      }
    } else if (typeof v === 'boolean') {
      span.className = 'v-boolean';
      span.textContent = v ? 'true' : 'false';
    } else {
      span.className = 'v-null';
      span.textContent = String(v);
    }
    return span;
  }

  function childCount(v) {
    return Array.isArray(v) ? v.length : Object.keys(v).length;
  }

  function makeRow(keyLabel, value, depth, path) {
    var row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('data-path', path);
    row.style.setProperty('--d', String(depth));

    var container = isContainer(value);
    /* An empty object or array has nothing to reveal, so it gets no chevron
       (a toggle that renders nothing is a dead control). The summary stays. */
    var openable = container && childCount(value) > 0;
    var chev;
    if (openable) {
      chev = document.createElement('button');
      chev.type = 'button';
      chev.className = 'chev';
      chev.textContent = '▸';
      chev.setAttribute('aria-expanded', 'false');
      chev.setAttribute('aria-label', 'Expand ' + escapeDisplay(keyLabel));
    } else {
      chev = document.createElement('span');
      chev.className = 'chev-gap';
      chev.setAttribute('aria-hidden', 'true');
    }
    row.appendChild(chev);

    var content = document.createElement('span');
    content.className = 'content';
    var k = document.createElement('span');
    k.className = 'k';
    k.textContent = keyLabel === '' ? '""' : escapeDisplay(keyLabel);
    content.appendChild(k);
    var sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = ': ';
    content.appendChild(sep);
    if (container) {
      var sum = document.createElement('span');
      sum.className = 'sum';
      sum.textContent = summaryOf(value);
      content.appendChild(sum);
    } else {
      content.appendChild(leafSpan(value));
    }
    if (openable) {
      /* The chevron is a 40 px target next to a label several times its
         width, and the label looked like part of the same control. Clicking
         it now does what the chevron does -- unless the click is part of a
         gesture that means something else.

         A drag across the value is one such gesture, and the collapsed check
         catches it. Double-clicking a key to select the word is the other,
         and no check on the click alone can catch it: the first click of the
         pair fires while the selection is still collapsed, so it toggles,
         and only the second click can be recognised as part of a pair. So
         the second click is ignored (detail is the click count: 2 there, 1
         on every deliberate single click) and the dblclick that follows puts
         the first click's toggle back, leaving the row as it was and the
         word selected. */
      var toggledByClick = false;
      content.addEventListener('click', function (event) {
        if (event.detail > 1) { return; }
        var sel = window.getSelection ? window.getSelection() : null;
        if (sel && !sel.isCollapsed) { toggledByClick = false; return; }
        if (row._kids) { toggle(row); toggledByClick = true; }
      });
      content.addEventListener('dblclick', function () {
        if (toggledByClick) { toggle(row); toggledByClick = false; }
      });
    }
    row.appendChild(content);

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'copy';
    copy.textContent = 'copy';
    copy.setAttribute('aria-label', 'Copy path ' + escapePathForDisplay(path));
    /* The path is the product. Without a title it exists only in the
       accessibility tree, so a screen-reader user is told it and a sighted
       user is not. */
    copy.title = escapePathForDisplay(path);
    copy.addEventListener('click', function () {
      copyText(path, function (ok) {
        if (copy._timer) { clearTimeout(copy._timer); }
        if (!ok) {
          /* A copy that fails silently is indistinguishable from a click that
             never registered. The button the user just pressed is where their
             eyes already are, so the failure is said on the button; #message
             still carries the path in text, so it can be selected by hand and
             is announced to a screen reader. The message region sits above a
             tree thousands of rows tall, and scrolling it into view would
             throw a user who is deep in that tree back to the top of the page
             with no way back to the row they clicked. */
          showMessage('Could not reach the clipboard. The path is ' +
            escapePathForDisplay(path), '', 'note');
          copy.textContent = 'failed';
        } else {
          copy.textContent = 'copied';
          copy.classList.add('is-copied');
        }
        copy._timer = setTimeout(function () {
          copy.textContent = 'copy';
          copy.classList.remove('is-copied');
          copy._timer = null;
          /* Long enough to still be there when the eye comes back from the
             editor the path was pasted into. */
        }, 2000);
      });
    });
    row.appendChild(copy);

    row._jsonValue = value;
    row._path = path;
    row._keyLabel = keyLabel;
    row._depth = depth;
    row._chevron = openable ? chev : null;
    return row;
  }

  function appendNode(parent, keyLabel, value, depth, path, before) {
    var row = makeRow(keyLabel, value, depth, path);
    parent.insertBefore(row, before || null);
    if (row._chevron) {
      var kids = document.createElement('div');
      kids.className = 'kids';
      kids.style.display = 'none';
      parent.insertBefore(kids, before || null);
      row._kids = kids;
      row._cursor = 0;
      row._rendered = false;
      row._expanded = false;
      row._chevron.addEventListener('click', function () { toggle(row); });
    }
    return row;
  }

  function renderBatch(row, fromButton) {
    var v = row._jsonValue;
    var kids = row._kids;
    var isArr = Array.isArray(v);
    if (!row._entries && !isArr) { row._entries = Object.entries(v); }
    var total = isArr ? v.length : row._entries.length;

    /* The more button is never removed and re-created while batches remain:
       new rows are inserted before it and its label is updated in place, so
       keyboard focus stays on the element the user just activated. */
    var end = Math.min(row._cursor + BATCH, total);
    var first = null;
    for (var i = row._cursor; i < end; i++) {
      var key = isArr ? String(i) : row._entries[i][0];
      var val = isArr ? v[i] : row._entries[i][1];
      var added = appendNode(kids, key, val, row._depth + 1,
        row._path + segment(isArr, key, i), row._more);
      if (!first) { first = added; }
    }
    row._cursor = end;
    row._rendered = true;

    var remaining = total - end;
    if (remaining > 0) {
      if (!row._more) {
        var wrap = document.createElement('div');
        wrap.className = 'more';
        wrap.style.setProperty('--d', String(row._depth + 1));
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.addEventListener('click', function () { renderBatch(row, true); });
        wrap.appendChild(btn);
        kids.appendChild(wrap);
        row._more = wrap;
        row._moreButton = btn;
      }
      /* The last press of the button adds what is left, not a full batch --
         promising 200 and delivering 101 makes the label a lie. */
      row._moreButton.textContent = 'Show ' + Math.min(BATCH, remaining) +
        ' more (' + remaining + ' remaining)';
      /* The button keeps focus but the rows just inserted above it push it a
         full batch down the document, so without this the user is left
         pressing a control that is no longer on screen. */
      if (fromButton) { row._more.scrollIntoView({ block: 'nearest' }); }
    } else if (row._more) {
      var hadFocus = document.activeElement === row._moreButton;
      kids.removeChild(row._more);
      row._more = null;
      row._moreButton = null;
      if (hadFocus && first) {
        var next = first.querySelector('.chev') || first.querySelector('.copy');
        if (next) { next.focus(); }
      }
    }
  }

  function toggle(row) {
    if (row._expanded) {
      row._kids.style.display = 'none';
      row._expanded = false;
      row._chevron.textContent = '▸';
      row._chevron.setAttribute('aria-expanded', 'false');
      row._chevron.setAttribute('aria-label', 'Expand ' + escapeDisplay(row._keyLabel));
      return;
    }
    if (!row._rendered) { renderBatch(row); }
    row._kids.style.display = '';
    row._expanded = true;
    row._chevron.textContent = '▾';
    row._chevron.setAttribute('aria-expanded', 'true');
    row._chevron.setAttribute('aria-label', 'Collapse ' + escapeDisplay(row._keyLabel));
  }

  function render(value) {
    tree.textContent = '';
    var root = appendNode(tree, '$', value, 0, '$');
    if (root._chevron) { toggle(root); }
    var state = savedState;
    savedState = null;
    if (!state) { return null; }
    var stats = { kept: 0, total: state.count };
    /* This runs on nearly every parse, and the tree above is already complete
       and correct without any of it, so a throw in here degrades to the plain
       rebuild rather than taking the page down. */
    try {
      stats.kept = restoreExpanded(state);
      restoreScroll(state);
    } catch (e) { /* keep the rebuilt tree as it stands */ }
    return stats;
  }

  /* ---------- sample ---------- */

  var SAMPLE = JSON.stringify({
    "items": [
      {
        "id": 1,
        "user name": "Ada Lovelace",
        "email": "ada@example.com",
        "active": true,
        "score": 99.5,
        "tags": ["admin", "beta"],
        "note": null
      },
      {
        "id": 2,
        "user name": "Grace Hopper",
        "email": "grace@example.com",
        "active": false,
        "score": 87,
        "tags": ["ops"],
        "note": "A deliberately long value so you can see how the tree truncates display text at one hundred and twenty characters while the copied path stays exact."
      }
    ],
    "weird.key": "dots in a key force the bracket form",
    "it's": "so does an apostrophe",
    "0": "a numeric-looking key is not an array index",
    "": "the empty key",
    "meta": {
      "generated": "2026-08-11T09:30:00Z",
      "count": 2,
      "nested": { "a": { "b": { "c": [1, 2, 3] } } }
    }
  }, null, 2);

  /* ---------- wiring ---------- */

  var timer = null;

  function scheduleParse() {
    if (timer !== null) { clearTimeout(timer); }
    if (input.value.length > LARGE_INPUT) {
      timer = null;
      showHint(false);
      /* The tree from the last parse is still on screen and is now stale:
         say so, rather than letting it read as current. */
      showMessage(tree.firstChild
        ? 'Large input — press Tidy to parse (showing the previous parse).'
        : 'Large input — press Tidy to parse.', '', 'note');
      return;
    }
    timer = setTimeout(function () {
      timer = null;
      parseAndRender(input.value);
    }, DEBOUNCE_MS);
  }

  function tidyNow(opts) {
    if (timer !== null) { clearTimeout(timer); timer = null; }
    parseAndRender(input.value, opts || { hard: true });
  }

  function tidyClicked() {
    tidyNow({ hard: true, seekPosition: true });
    if (!input.value.trim()) {
      showHint(true);
      input.focus();
    }
  }

  input.addEventListener('input', scheduleParse);
  input.addEventListener('blur', function () {
    /* Leaving the box ends the benefit of the doubt -- but the cached verdict
       is up to DEBOUNCE_MS old, and the document may have been finished since,
       so re-read the box instead of replaying it. Clearing softError first
       means the hard parse cannot re-enter here. Nothing expanded is lost:
       a soft error is only ever shown with the tree already emptied. */
    if (!softError) { return; }
    softError = null;
    /* Over the size limit the tree belongs to Tidy, not to a blur. */
    if (input.value.length > LARGE_INPUT) { return; }
    tidyNow();
  });
  document.getElementById('tidy').addEventListener('click', tidyClicked);
  document.getElementById('sample').addEventListener('click', function () {
    input.value = SAMPLE;
    tidyNow({ hard: true, reset: true });
  });
  document.getElementById('clear').addEventListener('click', function () {
    input.value = '';
    tidyNow({ hard: true, reset: true });
    input.focus();
  });

  parseAndRender(input.value);
}());
</script>
</body>
</html>
